# Catppuccin Macchiato colors
fg="#cad3f5"          # text
bg="#24273a"          # base

black="#24273a"       # color0: base
red="#ed8796"         # color1
green="#a6da95"       # color2
yellow="#f5a97f"      # color3
blue="#8aadf4"        # color4
magenta="#c6a0f6"     # color5 (mauve)
cyan="#8bd5ca"        # color6 (teal)
white="#a6adc8"       # color7 (subtext0)

set -g status-left-length 100
set -g status-style "fg=${fg}, bg=default"
set -g status-right "#[fg=${blue}] Pane: #P"
set -g status-left "#[fg=${magenta}, bold]  #S #[fg=${fg}, nobold]| "

set -g window-status-current-format "#[fg=${blue}]#[underscore]#I:#W"
set -g window-status-format "#I:#W"
set -g message-style "fg=${fg}, bg=default"
